---
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "100"
      TZ: "America/New_York"

    volumes:
      - /opt/docker/data/sonarr:/config
      - /mnt/bethel:/storage

    ports:
      - "8989:8989"

    logging:
      driver: local
