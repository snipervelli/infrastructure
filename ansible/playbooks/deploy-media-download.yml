---
- name: Deploy media download stack
  hosts: docker
  become: true
  gather_facts: false

  vars:
    media_stack_src: "{{ playbook_dir }}/../../containers/stacks/media-download"
    media_stack_dest: /opt/docker/stacks/media-download

  tasks:
    - name: Ensure media download stack directory exists
      ansible.builtin.file:
        path: "{{ media_stack_dest }}"
        state: directory
        owner: root
        group: docker
        mode: '0770'

    - name: Ensure SABnzbd data directory exists
      ansible.builtin.file:
        path: /opt/docker/data/sabnzbd
        state: directory
        owner: "1000"
        group: "100"
        mode: '0770'

    - name: Deploy media download Compose definition
      ansible.builtin.copy:
        src: "{{ media_stack_src }}/compose.yml"
        dest: "{{ media_stack_dest }}/compose.yml"
        owner: root
        group: docker
        mode: '0640'

    - name: Deploy media download environment file
      ansible.builtin.copy:
        dest: "{{ media_stack_dest }}/.env"
        owner: root
        group: docker
        mode: '0600'
        content: |
          PIA_USERNAME={{ pia_username }}
          PIA_PASSWORD={{ pia_password }}
      no_log: true

    - name: Validate media download Compose definition
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ media_stack_dest }}"
      changed_when: false
      no_log: true

    - name: Deploy media download stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ media_stack_dest }}"
      register: media_stack_deploy
      changed_when: >-
        'Started' in media_stack_deploy.stdout or
        'Created' in media_stack_deploy.stdout or
        'Recreated' in media_stack_deploy.stdout or
        'Pulled' in media_stack_deploy.stdout
      no_log: true

    - name: Wait for SABnzbd web interface
      ansible.builtin.uri:
        url: http://127.0.0.1:8080
        status_code: 200
      register: sabnzbd_http
      retries: 30
      delay: 2
      until: sabnzbd_http.status == 200

    - name: Show media stack status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ media_stack_dest }}"
      register: media_stack_status
      changed_when: false

    - name: Deployment complete
      ansible.builtin.debug:
        var: media_stack_status.stdout_lines
