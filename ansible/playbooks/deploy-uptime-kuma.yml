---
- name: Deploy Uptime Kuma
  hosts: docker
  become: true
  gather_facts: false

  vars:
    uptime_kuma_stack_src: "{{ playbook_dir }}/../../containers/stacks/uptime-kuma"
    uptime_kuma_stack_dest: /opt/docker/stacks/uptime-kuma
    uptime_kuma_data_dir: /opt/docker/data/uptime-kuma

  tasks:
    - name: Ensure Uptime Kuma data directory exists
      ansible.builtin.file:
        path: "{{ uptime_kuma_data_dir }}"
        state: directory
        owner: root
        group: docker
        mode: '0775'

    - name: Ensure Uptime Kuma stack directory exists
      ansible.builtin.file:
        path: "{{ uptime_kuma_stack_dest }}"
        state: directory
        owner: root
        group: docker
        mode: '0775'

    - name: Deploy Uptime Kuma Compose definition
      ansible.builtin.copy:
        src: "{{ uptime_kuma_stack_src }}/compose.yml"
        dest: "{{ uptime_kuma_stack_dest }}/compose.yml"
        owner: root
        group: docker
        mode: '0644'
      register: uptime_kuma_compose

    - name: Validate Uptime Kuma Compose definition
      ansible.builtin.command:
        cmd: docker compose config
        chdir: "{{ uptime_kuma_stack_dest }}"
      changed_when: false

    - name: Deploy Uptime Kuma stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ uptime_kuma_stack_dest }}"
      register: uptime_kuma_deploy
      changed_when: >-
        'Started' in uptime_kuma_deploy.stdout or
        'Created' in uptime_kuma_deploy.stdout or
        'Recreated' in uptime_kuma_deploy.stdout or
        'Pulled' in uptime_kuma_deploy.stdout

    - name: Wait for Uptime Kuma
      ansible.builtin.uri:
        url: http://127.0.0.1:3001
        status_code: 200
      register: uptime_kuma_http
      retries: 30
      delay: 2
      until: uptime_kuma_http.status == 200

    - name: Show Uptime Kuma status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ uptime_kuma_stack_dest }}"
      register: uptime_kuma_status
      changed_when: false

    - name: Deployment complete
      ansible.builtin.debug:
        var: uptime_kuma_status.stdout_lines
