---
- name: Test Proxmox API access
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/proxmox/vault.yml
    - ../group_vars/proxmox/main.yml

  tasks:
    - name: Query Proxmox cluster resources
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/cluster/resources"
        method: GET
        headers:
          Authorization: >-
            PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      register: proxmox_api_test
      no_log: true

    - name: Confirm API access
      ansible.builtin.debug:
        msg: >-
          Proxmox API authentication succeeded and returned
          {{ proxmox_api_test.json.data | length }} cluster resources.
